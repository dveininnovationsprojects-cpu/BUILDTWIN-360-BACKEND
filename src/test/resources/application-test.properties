spring.application.name=BuildTwin-360-Test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:buildtwintestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Secret Key for Test Profile
jwt.secret.key=8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F4A5B6C7D8E9F0A1B2C3D4E5F6A7B8C9D
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

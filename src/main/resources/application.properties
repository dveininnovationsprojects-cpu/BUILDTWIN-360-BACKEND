spring.application.name=BuildTwin-360

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/buildtwin
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# Security & JWT Configuration
jwt.secret.key=8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F4A5B6C7D8E9F0A1B2C3D4E5F6A7B8C9D
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000
server.port=8080

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.com.example.BuildTwin._0=DEBUG


#Swagger UI: http://localhost:8080/swagger-ui.html
#
#OpenAPI Spec: http://localhost:8080/v3/api-docs
spring.application.name=BuildTwin-360
spring.main.allow-bean-definition-overriding=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/buildtwin
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha 
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# Security & JWT Configuration
jwt.secret.key=8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F4A5B6C7D8E9F0A1B2C3D4E5F6A7B8C9D
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000
server.port=8080

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.com.example.BuildTwin._0=DEBUG

# =========================================================================
# Dynamic Construction Site Unit Rates (INR) & Seed Configurations
# Customize these values directly to match your real project requirements
# =========================================================================
# --- Data Seeder Control (Set to false in production to disable automatic demo data seeding) ---
app.seed.enabled=true

# --- Equipment Standard Operational Hourly Rate ---
app.cost.rates.equipment.hourly-default=1200.00

# --- Labour Trade Hourly Standard Wage Rates ---
app.cost.rates.labour.mason=200.00
app.cost.rates.labour.carpenter=220.00
app.cost.rates.labour.electrician=250.00
app.cost.rates.labour.helper=120.00
app.cost.rates.labour.default=180.00

# --- Default Seed Administrator Credentials ---
app.seed.admin.username=admin
app.seed.admin.email=admin@buildtwin360.com
app.seed.admin.password=Admin@123

# --- Master Project Seed Configuration ---
app.seed.project.name=Ashok Grandeur - Padur, Chennai
app.seed.project.code=PADUR-AG-01
app.seed.project.budget=45000000.00
app.seed.project.client=Ashok Builders & Developers

# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI Spec: http://localhost:8080/v3/api-docs

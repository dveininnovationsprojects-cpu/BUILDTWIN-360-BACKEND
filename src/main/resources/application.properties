spring.application.name=BuildTwin-360

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/buildtwin
spring.datasource.username=postgres
spring.datasource.password=navin2065
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.show-actuator=false

# Security & Server Configuration
jwt.secret.key=8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F4A5B6C7D8E9F0A1B2C3D4E5F6A7B8C9D
server.port=8080

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.example.BuildTwin._0=DEBUG
